name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and import checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+asyncpg://ci_user:ci_password@localhost:5432/ci_db
      RUN_INTEGRATION_TESTS: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Verify migrations on a clean database
        working-directory: backend
        run: |
          alembic upgrade head
          alembic check

      - name: Verify baseline on an existing schema
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio
          import os

          import asyncpg

          async def reset_version():
              url = os.environ["DATABASE_URL"].replace(
                  "postgresql+asyncpg://",
                  "postgresql://",
              )
              connection = await asyncpg.connect(url)
              try:
                  await connection.execute("DROP TABLE alembic_version")
              finally:
                  await connection.close()

          asyncio.run(reset_version())
          PY
          alembic upgrade head
          alembic check

      - name: Run unit tests
        run: python -m unittest discover -s backend/tests -v

      - name: Compile application and tests
        run: python -m compileall -q backend/app backend/tests

      - name: Import FastAPI and Celery applications
        run: |
          python - <<'PY'
          from app.main import app
          from app.tasks.celery_worker import celery_app

          assert app.title == "Sber Grace Assistant"
          assert "check-grace-deadlines" in celery_app.conf.beat_schedule
          assert "recover-stale-transactions" in celery_app.conf.beat_schedule
          print("FastAPI and Celery imports are healthy")
          PY

  container:
    name: Production image build
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --tag sber-assistant-backend:ci backend
